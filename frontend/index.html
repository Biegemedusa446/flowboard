<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg:#0f172a;        /* slate-900 */
        --panel:#111827;     /* gray-900 */
        --muted:#94a3b8;     /* slate-400 */
        --card:#0b1220;      /* custom dark */
        --accent:#7c3aed;    /* violet-600 */
        --accent-2:#22c55e;  /* green-500 */
        --accent-3:#06b6d4;  /* cyan-500 */
        --border:#1f2937;    /* gray-800 */
        --ring:rgba(124,58,237,.35);
      }
      *{ box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 80% -10%, rgba(124,58,237,.12), transparent),
                    radial-gradient(900px 400px at 0% 10%, rgba(6,182,212,.10), transparent),
                    var(--bg);
        color: white;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .app-shell{
        display:flex; flex-direction:column; height:100%;
      }
      .topbar{
        display:flex; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid var(--border);
        backdrop-filter: blur(6px);
      }
      .brand{ font-weight:700; letter-spacing:.2px; }
      .tabs{ display:flex; gap:8px; margin-left:auto; }
      .tab{
        padding:10px 14px; border:1px solid var(--border); border-radius:10px;
        background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00));
        color:var(--muted); cursor:pointer; user-select:none;
      }
      .tab.active{ border-color: var(--accent); color:#fff; box-shadow: 0 0 0 3px var(--ring) inset; }
      .board{
        display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; padding:20px; height:100%; overflow:auto;
      }
      .column{
        background: rgba(255,255,255,0.03);
        border:1px solid var(--border);
        border-radius:14px; padding:14px; min-height: 420px;
      }
      .column h3{ margin: 4px 6px 12px; font-size:15px; font-weight:700; letter-spacing:.3px; }
      .card{
        background: var(--card); border:1px solid var(--border);
        border-radius:12px; padding:12px; margin:10px; box-shadow: 0 6px 16px rgba(0,0,0,.25);
      }
      .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .muted{ color: var(--muted); font-size: 12px; }
      .suggest-bar{
        display:flex; gap:8px; padding: 0 20px 14px; flex-wrap:wrap;
      }
      .btn{
        padding:10px 14px; border-radius:999px; border:1px solid var(--border); background: rgba(255,255,255,.03); color:#fff; cursor:pointer;
      }
      .btn:hover{ border-color:#334155; }
      .btn.accent{ border-color: var(--accent); }
      .stat{
        display:flex; gap:8px; align-items:center; padding:8px 10px; border-radius:10px; background: rgba(124,58,237,.08);
      }
      .kpi{ font-weight:700; }
      .list{ list-style:none; padding:0; margin:0; }
      .list li{ padding:10px 12px; border-bottom:1px dashed var(--border); }
      .pill{ padding:4px 8px; border-radius:999px; font-size:11px; border:1px solid var(--border); color:var(--muted); }
      .tag-green{ background: rgba(34,197,94,.12); color:#86efac; border-color: rgba(34,197,94,.35); }
      .tag-cyan{ background: rgba(6,182,212,.12); color:#67e8f9; border-color: rgba(6,182,212,.35); }
      .tag-rose{ background: rgba(244,63,94,.12); color:#fda4af; border-color: rgba(244,63,94,.35); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
